<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacred Heart Academy — Academic Assessment Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090d16;
      --card-surface: #0f172a;
      --card-border: #1e293b;
      --brand-blue: #2563eb;
      --brand-blue-hover: #1d4ed8;
      --gold-accent: #f59e0b;
      --text-high: #f8fafc;
      --text-medium: #94a3b8;
      --text-low: #64748b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-canvas); color: var(--text-high); min-height: 100vh; padding: 24px 16px 48px; }

    .portal-shell { max-width: 660px; margin: 0 auto; }

    /* Portal Container */
    .portal-card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* School Branding Block */
    .brand-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .school-crest {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 2.5px solid #2563eb;
      box-shadow: 0 0 25px rgba(37, 99, 235, 0.35);
      background-color: #000;
    }

    .school-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-transform: uppercase;
    }

    .school-subtitle {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--gold-accent);
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Meta Ribbon */
    .meta-ribbon {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: #080c14;
      border: 1px solid #162032;
      border-radius: 14px;
      padding: 14px 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .ribbon-cell span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-low);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .ribbon-cell strong {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    /* Input Fields */
    .field-group { margin-bottom: 20px; text-align: left; }
    .field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-medium);
      margin-bottom: 8px;
    }

    .field-input {
      width: 100%;
      background: #090e17;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .field-input:focus {
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .btn-action {
      width: 100%;
      background: var(--brand-blue);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 8px;
    }

    .btn-action:hover { background: var(--brand-blue-hover); }
    .btn-action:active { transform: scale(0.99); }
    .btn-action:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }

    /* Exam Screen Top Navigation */
    .exam-nav {
      position: sticky;
      top: 12px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .candidate-name { font-size: 0.9rem; font-weight: 600; color: #cbd5e1; }
    .timer-badge {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #991b1b;
      padding: 5px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    /* Question Panels */
    .question-block {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 18px;
    }

    .q-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-pill {
      font-size: 0.75rem;
      font-weight: 700;
      color: #60a5fa;
      background: rgba(37, 99, 235, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f8fafc;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .choices-column { display: flex; flex-direction: column; gap: 10px; }
    .choice-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #090e17;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 13px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.15s ease;
      color: #cbd5e1;
    }

    .choice-row:hover { border-color: #334155; background: #0e1524; }
    .choice-row.selected {
      border-color: #3b82f6;
      background: rgba(37, 99, 235, 0.15);
      color: #ffffff;
      font-weight: 600;
    }
    .choice-row input { accent-color: var(--brand-blue); transform: scale(1.15); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="portal-shell">
    <!-- PAGE 1: Login & Exam Details -->
    <div class="portal-card" id="loginCard">
      <div class="brand-section">
        <img src="logo.png" alt="Sacred Heart Academy Crest" class="school-crest" onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=SHA'">
        <h1 class="school-title">Sacred Heart Academy</h1>
        <div class="school-subtitle">Affiliated to CBSE • Estd: 2025</div>
      </div>

      <div class="meta-ribbon">
        <div class="ribbon-cell">
          <span>Target Paper</span>
          <strong id="displayMeta">Class 2 Maths</strong>
        </div>
        <div class="ribbon-cell">
          <span>Duration</span>
          <strong id="displayDuration">45 Mins</strong>
        </div>
        <div class="ribbon-cell">
          <span>Questions</span>
          <strong id="displayCount">20 MCQs</strong>
        </div>
      </div>

      <div class="field-group">
        <label for="studentName" class="field-label">Student Full Name *</label>
        <input type="text" id="studentName" class="field-input" placeholder="e.g. Rahul Sharma" autocomplete="off" required>
      </div>

      <div class="field-group">
        <label for="studentRoll" class="field-label">Roll Number *</label>
        <input type="text" id="studentRoll" class="field-input" placeholder="e.g. 14" autocomplete="off" required>
      </div>

      <button class="btn-action" id="startBtn" onclick="startAssessment()" disabled>Loading Examination Sheet...</button>
    </div>

    <!-- PAGE 2: Active Timed Exam Screen -->
    <div class="hidden" id="examCard">
      <div class="exam-nav">
        <div class="candidate-name" id="activeStudent">Candidate Name</div>
        <div class="timer-badge" id="countdown">45:00</div>
      </div>

      <div id="questionsContainer"></div>

      <button class="btn-action" style="background: var(--success); margin-top: 14px;" onclick="submitExam(false)">
        Submit Final Examination
      </button>
    </div>

    <!-- PAGE 3: Final Score Confirmation -->
    <div class="portal-card hidden" id="finishCard" style="text-align: center; padding: 48px 24px;">
      <div style="width: 72px; height: 72px; background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #059669; font-size: 2.2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">✓</div>
      <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; color: #ffffff; margin-bottom: 6px;">Exam Submitted!</h2>
      <p id="studentSummary" style="color: var(--text-low); font-size: 0.95rem; margin-bottom: 24px;"></p>

      <div style="background: #080c14; border: 1px dashed var(--card-border); border-radius: 14px; padding: 24px; margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-medium); text-transform: uppercase; letter-spacing: 0.05em;">Assessment Score</span>
        <div id="scoreBox" style="font-family: 'Space Grotesk', sans-serif; font-size: 3.2rem; font-weight: 700; color: #38bdf8; margin-top: 6px;">0 / 20</div>
      </div>

      <p style="font-size: 0.88rem; color: var(--text-low); margin-bottom: 24px;">Your responses have been recorded. You can safely close this browser window.</p>
      <button class="btn-action" style="background: #1e293b; color: #cbd5e1;" onclick="window.close(); alert('You may now close this window.');">Exit Assessment</button>
    </div>
  </div>

<script>
const GITHUB_USER = "codomainalex";
const GITHUB_REPO = "school-exam";
const GITHUB_BRANCH = "main";

const urlParams = new URLSearchParams(window.location.search);
const examFile = urlParams.get('test') || 'class2_maths';
const durationMinutes = parseInt(urlParams.get('mins')) || 45;

let parsedQuestions = [];
let userAnswers = {};
let timerId = null;
let secondsRemaining = durationMinutes * 60;

function formatMetadata(fileName) {
  const parts = fileName.split('_');
  const classPart = parts[0] ? parts[0].replace(/([a-zA-Z]+)(\d+)/, '$1 $2').toUpperCase() : 'GENERAL';
  const subjectPart = parts[1] ? parts[1].charAt(0).toUpperCase() + parts[1].slice(1) : 'Exam';
  return `${classPart} — ${subjectPart}`;
}

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('displayMeta').innerText = formatMetadata(examFile);
  document.getElementById('displayDuration').innerText = `${durationMinutes} Mins`;

  const rawCsvUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/exams/${examFile}.csv`;

  Papa.parse(rawCsvUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      if (!results.data || results.data.length === 0) {
        alert(`Could not load questions for exam: ${examFile}`);
        return;
      }

      const correctIndexMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };

      parsedQuestions = results.data.map((row, index) => {
        const correctLetter = (row.Correct || row.correct || 'A').trim().toUpperCase();
        return {
          id: index,
          q: row.Question || row.question,
          choices: [
            row.A || row.option_a,
            row.B || row.option_b,
            row.C || row.option_c,
            row.D || row.option_d
          ],
          correctIdx: correctIndexMap[correctLetter] ?? 0
        };
      });

      document.getElementById('displayCount').innerText = `${parsedQuestions.length} MCQs`;
      const btn = document.getElementById('startBtn');
      btn.innerText = "Proceed to Examination →";
      btn.disabled = false;
    },
    error: function() {
      alert(`Failed to load ${examFile}.csv from GitHub.`);
    }
  });
});

function startAssessment() {
  const name = document.getElementById('studentName').value.trim();
  const roll = document.getElementById('studentRoll').value.trim();
  if (!name || !roll) return alert('Both Full Name and Roll Number are required.');

  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('examCard').classList.remove('hidden');
  document.getElementById('activeStudent').innerText = `${name} (Roll: ${roll})`;

  renderQuestions();
  startTimer();
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');

  const randomizedQuestions = shuffle(parsedQuestions.map(item => ({
    ...item,
    shuffledChoices: shuffle(item.choices.map((choiceText, origIdx) => ({
      text: choiceText,
      origIdx: origIdx
    })))
  })));

  container.innerHTML = randomizedQuestions.map((q, displayIdx) => `
    <div class="question-block">
      <div class="q-top-row">
        <span class="q-pill">Question ${displayIdx + 1} of ${randomizedQuestions.length}</span>
        <span style="font-size:0.75rem; color:#64748b; font-weight:600;">1 Mark</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="choices-column">
        ${q.shuffledChoices.map(c => `
          <label class="choice-row" onclick="selectChoice(this)">
            <input type="radio" name="q_${q.id}" value="${c.origIdx}" onchange="recordAnswer(${q.id}, ${c.origIdx})">
            <span>${c.text}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function selectChoice(labelEl) {
  const parent = labelEl.parentElement;
  parent.querySelectorAll('.choice-row').forEach(el => el.classList.remove('selected'));
  labelEl.classList.add('selected');
}

function recordAnswer(qId, choiceIdx) {
  userAnswers[qId] = choiceIdx;
}

function startTimer() {
  const countdownEl = document.getElementById('countdown');
  timerId = setInterval(() => {
    secondsRemaining--;
    const mins = Math.floor(secondsRemaining / 60);
    const secs = secondsRemaining % 60;
    countdownEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

    if (secondsRemaining <= 0) {
      clearInterval(timerId);
      alert('Time is up! Submitting exam automatically.');
      submitExam(true);
    }
  }, 1000);
}

function submitExam(isAuto) {
  if (!isAuto && !confirm('Are you sure you want to finish and submit your exam?')) {
    return;
  }

  clearInterval(timerId);
  const name = document.getElementById('studentName').value.trim();
  const roll = document.getElementById('studentRoll').value.trim();

  let score = 0;
  parsedQuestions.forEach(q => {
    if (userAnswers[q.id] === q.correctIdx) score++;
  });

  document.getElementById('examCard').classList.add('hidden');
  document.getElementById('finishCard').classList.remove('hidden');
  document.getElementById('studentSummary').innerText = `Candidate: ${name} | Roll No: ${roll}`;
  document.getElementById('scoreBox').innerText = `${score} / ${parsedQuestions.length}`;
}
</script>
</body>
</html>
